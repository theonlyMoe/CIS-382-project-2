{% extends "base.html" %}
{% block title %}تعديل مستخدم{% endblock %}
{% block body %}
<div class="container narrow">
    <div class="icon">✎</div>
    <h1>تعديل المستخدم</h1>
    <p class="subtitle">عدّل بيانات المستخدم أدناه</p>

    <form action="{{ url_for('update_user_route', id=user['id']) }}" method="POST">
        <div class="group">
            <label for="name">الاسم</label>
            <input type="text" id="name" name="name" value="{{ user['name'] }}" required>
        </div>
        <div class="group">
            <label for="age">العمر</label>
            <input type="number" id="age" name="age" value="{{ user['age'] }}" required>
        </div>
        <button class="btn" type="submit">حفظ التعديلات</button>
    </form>

    <div style="text-align:center;margin-top:20px">
        <a class="link" href="{{ url_for('users_page') }}">→ العودة لقائمة المستخدمين</a>
    </div>
</div>
{% endblock %}
