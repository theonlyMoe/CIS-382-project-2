
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask CRUD App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #fff;
            padding: 50px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #151515;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #292929;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            background: #222;
            border: 1px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        /* Sections */

        .section {
            margin-bottom: 35px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 18px;
            color: #ddd;
        }

        /* Form */

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-size: 13px;
            color: #999;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            font-size: 15px;
            color: #fff;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #666;
            background: #111;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        button {
            padding: 13px;
            margin-top: 5px;
            font-size: 15px;
            font-weight: bold;
            color: #000;
            background: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #dcdcdc;
            transform: translateY(-1px);
        }

        /* Divider */

        .divider {
            height: 1px;
            background: #292929;
            margin: 35px 0;
        }

        /* User List */

        .user-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-list li {
            background: #0d0d0d;
            border: 1px solid #292929;
            padding: 15px 18px;
            border-radius: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            transition: 0.3s;
        }

        .user-list li:hover {
            border-color: #444;
            background: #111;
            transform: translateY(-1px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #222;
            border: 1px solid #333;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;
        }

        .user-name {
            font-size: 15px;
            font-weight: bold;
            color: #eee;
        }

        .user-age {
            font-size: 13px;
            color: #777;
            margin-top: 3px;
        }

        /* Actions */

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.3s;
        }

        .edit-link {
            color: #ccc;
            border: 1px solid #333;
        }

        .edit-link:hover {
            background: #fff;
            color: #000;
        }

        .delete-link {
            color: #aaa;
            border: 1px solid #333;
        }

        .delete-link:hover {
            background: #333;
            color: #fff;
        }

        /* Empty state */

        .empty {
            text-align: center;
            padding: 30px;
            color: #666;
            border: 1px dashed #333;
            border-radius: 10px;
        }

        /* Responsive */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .user-list li {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .actions {
                width: 100%;
            }

            .actions a {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="header-icon">👤</div>
            <h1>User Management</h1>
            <p class="subtitle">Manage your users easily</p>
        </div>


        <!-- Add User -->
        <div class="section">

            <h2>Add New User</h2>

            <form action="/add_user" method="POST">

                <div class="input-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter user's name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter user's age"
                        required
                    >
                </div>

                <button type="submit">+ Add User</button>

            </form>

        </div>


        <div class="divider"></div>


        <!-- Users List -->
        <div class="section">

            <h2>Users List</h2>

            {% if users %}

            <ul class="user-list">

                {% for user in users %}

                <li>

                    <div class="user-info">

                        <div class="user-icon">
                            👤
                        </div>

                        <div>
                            <div class="user-name">
                                {{ user[1] }}
                            </div>

                            <div class="user-age">
                                Age: {{ user[2] }}
                            </div>
                        </div>

                    </div>


                    <div class="actions">

                        <a
                            href="{{ url_for('update_user_route', id=user[0]) }}"
                            class="edit-link"
                        >
                            Edit
                        </a>

                        <a
                            href="{{ url_for('delete_user_route', id=user[0]) }}"
                            class="delete-link"
                        >
                            Delete
                        </a>

                    </div>

                </li>

                {% endfor %}

            </ul>

            {% else %}

            <div class="empty">
                No users found.
            </div>

            {% endif %}

        </div>

    </div>

</body>
</html>
```
